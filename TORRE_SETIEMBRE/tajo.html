<style>
/* ---------- el tajo a la hora dorada (tajo.js) ----------
   La escena ahora es clara (desierto al atardecer), asi que el texto de
   Inicio necesita un velo: oscuro a la izquierda, donde va el titulo, y
   abajo, donde van las cifras; a la derecha el tajo se ve limpio. */
.tajo::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg, rgba(4,16,30,.86) 0%, rgba(4,16,30,.62) 30%, rgba(4,16,30,.16) 58%, rgba(4,16,30,0) 76%),
             linear-gradient(0deg, rgba(4,16,30,.72) 0%, rgba(4,16,30,0) 38%),
             linear-gradient(180deg, rgba(4,16,30,.55) 0%, rgba(4,16,30,0) 16%)}
/* sin desenfoque sobre el tajo animado: el navegador tendria que volver a
   desenfocar esa franja en cada cuadro, y eso hace que el movimiento salga a
   tirones. Un fondo algo mas opaco da casi el mismo aspecto. */
.nav, .nav.fondo, .nav.claro{backdrop-filter:none; -webkit-backdrop-filter:none}
.cifras{backdrop-filter:none; -webkit-backdrop-filter:none}
@media (max-width:820px){
  .tajo::after{background:linear-gradient(180deg, rgba(4,16,30,.5) 0%, rgba(4,16,30,.28) 30%, rgba(4,16,30,.72) 100%)}
}
</style>
